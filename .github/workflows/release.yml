# .github/workflows/release.yml
# Every time schema.sql, seed.sql or build.sh changes on main: build catalog.sqlite and
# replace the files in the main-catalog release. The app always downloads from there.
name: Release catalog

on:
  push:
    branches: [main]                                 # only pushes to main
    paths: ['schema.sql', 'seed.sql', 'build.sh']    # only when the catalog changed
  workflow_dispatch:                                 # adds a "Run workflow" button

permissions:
  contents: write                                    # lets the workflow update releases

jobs:
  release:
    runs-on: ubuntu-latest                           # a fresh Linux computer from GitHub
    steps:
      - uses: actions/checkout@v4                    # copy the repo onto it

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Build catalog.sqlite and manifest.json
        run: sh ./build.sh "0.1.${{ github.run_number }}"   # version goes up by one each run

      - name: Replace the files in the main-catalog release
        env:
          GH_TOKEN: ${{ github.token }}              # permission for the gh command
        run: gh release upload main-catalog catalog.sqlite manifest.json --clobber